<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GANTI NAMA WEBSITE DI TAB BROWSER DI SINI -->
<title>Welcome to Relexz Store</title>

<style>

/* BACKGROUND ANIMASI (boleh ganti warna di bawah ini) */
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:linear-gradient(-45deg,#4e73df,#1cc88a,#36b9cc,#f6c23e);
  background-size:400% 400%;
  animation:gradientBG 10s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

h1{
  text-align:center;
  color:white;
  padding-top:30px;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background: black;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  text-align:center;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
}

.card img{
  width:100%;
  border-radius:15px;
  margin-bottom:15px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#25d366;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.payment{
  margin-top:30px;
  font-size:14px;
  background:white;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

</style>
</head>
<body>

<!-- GANTI JUDUL BESAR WEBSITE DI SINI -->
<h1>Toko Digital Premium</h1>

<div class="container">
  <div class="products">

    <!-- ================== PRODUK 1 ================== -->
    <div class="card">

      <!-- GANTI NAMA PRODUK DI SINI -->
      <h2>SCRIPT NIKA V20</h2>

      <!-- GANTI FOTO PRODUK (isi link gambar di src) -->
      <img src="https://files.catbox.moe/e4xt7v.jpg">

      <!-- GANTI DESKRIPSI PRODUK DI SINI -->
      <p>No up</p>

      <!-- GANTI HARGA DI SINI -->
      <div class="price">Rp 20.000</div>

      <!-- GANTI NAMA PRODUK & HARGA DI DALAM ORDER JUGA -->
      <button onclick="order('Resseller Premium - Rp 60.000')">
        Order Sekarang
      </button>

    </div>


    <div class="card">

      <!-- GANTI NAMA PRODUK DI SINI -->
      <h2>Script Justin V25</h2>

      <!-- GANTI FOTO PRODUK (isi link gambar di src) -->
      <img src="https://files.catbox.moe/84k6ye.jpg">

      <!-- GANTI DESKRIPSI PRODUK DI SINI -->
      <p>Buyer VVIP (Full Up)</p>

      <!-- GANTI HARGA DI SINI -->
      <div class="price">Rp 100.000</div>

      <!-- GANTI NAMA PRODUK & HARGA DI DALAM ORDER JUGA -->
      <button onclick="order('No up - Rp 40.000')">
        Order Sekarang
      </button>

    </div>
    <!-- ================== PRODUK 2 ================== -->
    <div class="card">

      <!-- GANTI NAMA PRODUK DI SINI -->
      <h2>Murbug Private by Relexzz</h2>

      <!-- GANTI FOTO PRODUK -->
      <img src="https://files.catbox.moe/s0sxdi.jpg">

      <!-- GANTI DESKRIPSI -->
      <p>Akses staff full fitur dan prioritas.</p>

      <!-- GANTI HARGA -->
      <div class="price">Rp 30.000</div>

      <!-- JANGAN LUPA SAMAKAN DENGAN HARGA DI ATAS -->
      <button onclick="order('Admin murbug - Rp 20.000')">
        Order Sekarang
      </button>

    </div>

  </div>

  <!-- GANTI NOMOR DANA DI SINI -->
  <div class="payment">
    Pembayaran via DANA:<br>
    <b>087786097784</b>
  </div>

</div>

<script>

// GANTI NOMOR WHATSAPP DI SINI
// Format: 6287786097784
// Contoh: 6281234567890

function order(paket){
  const pesan = `Halo Bg,%0A%0ASaya ingin order:%0A${paket}%0A%0APembayaran via DANA sudah dilakukan.%0ATerima kasih.`;

  window.open("https://wa.me/6287786097784?text=" + pesan);
}

</script>

</body>
</html>
